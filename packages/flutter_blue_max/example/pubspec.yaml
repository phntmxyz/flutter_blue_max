name: flutter_blue_max_example
description: A Bluetooth workbench for GATT and L2CAP on Android, iOS and macOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_blue_max:
    path: ../
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  file_selector_platform_interface: ^2.7.0
  flutter_blue_max_platform_interface:
    path: ../../flutter_blue_max_platform_interface
  flutter_test:
    sdk: flutter
  lint: ^2.14.0
  share_plus_platform_interface: ^7.2.0
  spot: ^0.18.0

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: true
