name: flutter_blue_max
description: Flutter plugin for connecting and communicating with Bluetooth Low Energy devices, with L2CAP channel support (client & server) on iOS, macOS and Android.
version: 2.0.0
homepage: https://github.com/phntmxyz/flutter_blue_max

environment:
  sdk: ^3.0.0
  flutter: '>=3.7.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_max_platform_interface: 6.0.0
  flutter_blue_max_android: 6.0.0
  flutter_blue_max_darwin: 6.0.0
  flutter_blue_max_linux: 6.0.0
  flutter_blue_max_web: 6.0.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        default_package: flutter_blue_max_android
      ios:
        default_package: flutter_blue_max_darwin
      linux:
        default_package: flutter_blue_max_linux
      macos:
        default_package: flutter_blue_max_darwin
      web:
        default_package: flutter_blue_max_web
